<?xml version="1.0" encoding="UTF-8"?>
<svg width="1200" height="800" viewBox="0 0 1200 800" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <style>
      .title { font-family: 'Prompt', Arial, sans-serif; font-size: 24px; font-weight: bold; fill: #1e293b; }
      .subtitle { font-family: 'Prompt', Arial, sans-serif; font-size: 14px; font-weight: 600; fill: #475569; }
      .label { font-family: 'Prompt', Arial, sans-serif; font-size: 12px; fill: #64748b; }
      .component { fill: #f8fafc; stroke: #e2e8f0; stroke-width: 2; rx: 8; }
      .frontend { fill: #dbeafe; stroke: #3b82f6; stroke-width: 2; }
      .backend { fill: #dcfce7; stroke: #16a34a; stroke-width: 2; }
      .database { fill: #fef3c7; stroke: #d97706; stroke-width: 2; }
      .external { fill: #f3e8ff; stroke: #8b5cf6; stroke-width: 2; }
      .api-line { stroke: #6366f1; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .data-line { stroke: #16a34a; stroke-width: 3; fill: none; marker-end: url(#arrowhead); }
      .auth-line { stroke: #dc2626; stroke-width: 2; fill: none; stroke-dasharray: 5,5; }
    </style>
    <marker id="arrowhead" markerWidth="10" markerHeight="7" refX="9" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#6366f1" />
    </marker>
  </defs>

  <!-- Title -->
  <text x="600" y="30" text-anchor="middle" class="title">Wang Sam Mo Jobs - System Architecture</text>
  
  <!-- Frontend Layer -->
  <g id="frontend">
    <rect x="50" y="60" width="500" height="300" class="frontend" />
    <text x="300" y="80" text-anchor="middle" class="subtitle">Frontend (React + TypeScript)</text>
    
    <!-- Pages -->
    <rect x="70" y="100" width="100" height="60" class="component" />
    <text x="120" y="120" text-anchor="middle" class="label">Pages</text>
    <text x="120" y="135" text-anchor="middle" class="label">Homepage</text>
    <text x="120" y="150" text-anchor="middle" class="label">Jobs Search</text>
    
    <rect x="190" y="100" width="100" height="60" class="component" />
    <text x="240" y="120" text-anchor="middle" class="label">Job Detail</text>
    <text x="240" y="135" text-anchor="middle" class="label">Company</text>
    <text x="240" y="150" text-anchor="middle" class="label">Applications</text>
    
    <!-- Components -->
    <rect x="310" y="100" width="100" height="60" class="component" />
    <text x="360" y="120" text-anchor="middle" class="label">Components</text>
    <text x="360" y="135" text-anchor="middle" class="label">Header/Footer</text>
    <text x="360" y="150" text-anchor="middle" class="label">JobCard</text>
    
    <rect x="430" y="100" width="100" height="60" class="component" />
    <text x="480" y="120" text-anchor="middle" class="label">UI Library</text>
    <text x="480" y="135" text-anchor="middle" class="label">shadcn/ui</text>
    <text x="480" y="150" text-anchor="middle" class="label">Radix UI</text>
    
    <!-- State Management -->
    <rect x="70" y="180" width="150" height="60" class="component" />
    <text x="145" y="200" text-anchor="middle" class="label">State Management</text>
    <text x="145" y="215" text-anchor="middle" class="label">React Query</text>
    <text x="145" y="230" text-anchor="middle" class="label">React Context</text>
    
    <!-- Routing -->
    <rect x="240" y="180" width="100" height="60" class="component" />
    <text x="290" y="200" text-anchor="middle" class="label">Routing</text>
    <text x="290" y="215" text-anchor="middle" class="label">Wouter</text>
    <text x="290" y="230" text-anchor="middle" class="label">Lightweight</text>
    
    <!-- Styling -->
    <rect x="360" y="180" width="150" height="60" class="component" />
    <text x="435" y="200" text-anchor="middle" class="label">Styling</text>
    <text x="435" y="215" text-anchor="middle" class="label">Tailwind CSS</text>
    <text x="435" y="230" text-anchor="middle" class="label">Custom Themes</text>
    
    <!-- Language Support -->
    <rect x="70" y="260" width="200" height="60" class="component" />
    <text x="170" y="280" text-anchor="middle" class="label">Internationalization</text>
    <text x="170" y="295" text-anchor="middle" class="label">Thai/English</text>
    <text x="170" y="310" text-anchor="middle" class="label">LanguageContext</text>
    
    <!-- Build Tools -->
    <rect x="290" y="260" width="220" height="60" class="component" />
    <text x="400" y="280" text-anchor="middle" class="label">Build Tools</text>
    <text x="400" y="295" text-anchor="middle" class="label">Vite + TypeScript</text>
    <text x="400" y="310" text-anchor="middle" class="label">HMR + Fast Builds</text>
  </g>

  <!-- Backend Layer -->
  <g id="backend">
    <rect x="650" y="60" width="500" height="300" class="backend" />
    <text x="900" y="80" text-anchor="middle" class="subtitle">Backend (Node.js + Express)</text>
    
    <!-- API Routes -->
    <rect x="670" y="100" width="120" height="80" class="component" />
    <text x="730" y="120" text-anchor="middle" class="label">API Routes</text>
    <text x="730" y="135" text-anchor="middle" class="label">GET /api/jobs</text>
    <text x="730" y="150" text-anchor="middle" class="label">GET /api/job/:id</text>
    <text x="730" y="165" text-anchor="middle" class="label">POST /api/apply</text>
    
    <!-- Middleware -->
    <rect x="810" y="100" width="120" height="80" class="component" />
    <text x="870" y="120" text-anchor="middle" class="label">Middleware</text>
    <text x="870" y="135" text-anchor="middle" class="label">Session Mgmt</text>
    <text x="870" y="150" text-anchor="middle" class="label">CORS</text>
    <text x="870" y="165" text-anchor="middle" class="label">Validation</text>
    
    <!-- Vite Integration -->
    <rect x="950" y="100" width="120" height="80" class="component" />
    <text x="1010" y="120" text-anchor="middle" class="label">Vite Server</text>
    <text x="1010" y="135" text-anchor="middle" class="label">Dev Integration</text>
    <text x="1010" y="150" text-anchor="middle" class="label">Hot Reload</text>
    <text x="1010" y="165" text-anchor="middle" class="label">Static Assets</text>
    
    <!-- Authentication -->
    <rect x="670" y="200" width="150" height="60" class="component" />
    <text x="745" y="220" text-anchor="middle" class="label">Authentication</text>
    <text x="745" y="235" text-anchor="middle" class="label">Express Session</text>
    <text x="745" y="250" text-anchor="middle" class="label">Passport.js</text>
    
    <!-- Data Layer -->
    <rect x="840" y="200" width="150" height="60" class="component" />
    <text x="915" y="220" text-anchor="middle" class="label">Data Layer</text>
    <text x="915" y="235" text-anchor="middle" class="label">Storage Interface</text>
    <text x="915" y="250" text-anchor="middle" class="label">Drizzle ORM</text>
    
    <!-- Server Config -->
    <rect x="670" y="280" width="200" height="60" class="component" />
    <text x="770" y="300" text-anchor="middle" class="label">Server Configuration</text>
    <text x="770" y="315" text-anchor="middle" class="label">TypeScript + tsx</text>
    <text x="770" y="330" text-anchor="middle" class="label">Environment Config</text>
    
    <!-- Performance -->
    <rect x="890" y="280" width="180" height="60" class="component" />
    <text x="980" y="300" text-anchor="middle" class="label">Performance</text>
    <text x="980" y="315" text-anchor="middle" class="label">Connection Pooling</text>
    <text x="980" y="330" text-anchor="middle" class="label">Query Optimization</text>
  </g>

  <!-- Database Layer -->
  <g id="database">
    <rect x="50" y="420" width="350" height="200" class="database" />
    <text x="225" y="440" text-anchor="middle" class="subtitle">Database (PostgreSQL)</text>
    
    <!-- Tables -->
    <rect x="70" y="460" width="100" height="80" class="component" />
    <text x="120" y="480" text-anchor="middle" class="label">Users Table</text>
    <text x="120" y="495" text-anchor="middle" class="label">id, username</text>
    <text x="120" y="510" text-anchor="middle" class="label">email, password</text>
    <text x="120" y="525" text-anchor="middle" class="label">created_at</text>
    
    <rect x="190" y="460" width="100" height="80" class="component" />
    <text x="240" y="480" text-anchor="middle" class="label">Jobs Table</text>
    <text x="240" y="495" text-anchor="middle" class="label">id, title, company</text>
    <text x="240" y="510" text-anchor="middle" class="label">description, salary</text>
    <text x="240" y="525" text-anchor="middle" class="label">location, type</text>
    
    <rect x="310" y="460" width="100" height="80" class="component" />
    <text x="360" y="480" text-anchor="middle" class="label">Applications</text>
    <text x="360" y="495" text-anchor="middle" class="label">id, user_id</text>
    <text x="360" y="510" text-anchor="middle" class="label">job_id, status</text>
    <text x="360" y="525" text-anchor="middle" class="label">applied_at</text>
    
    <!-- Database Features -->
    <rect x="70" y="560" width="120" height="40" class="component" />
    <text x="130" y="580" text-anchor="middle" class="label">Neon Database</text>
    <text x="130" y="590" text-anchor="middle" class="label">Serverless</text>
    
    <rect x="210" y="560" width="120" height="40" class="component" />
    <text x="270" y="580" text-anchor="middle" class="label">Connection Pool</text>
    <text x="270" y="590" text-anchor="middle" class="label">Auto-scaling</text>
    
    <rect x="350" y="560" width="120" height="40" class="component" />
    <text x="410" y="580" text-anchor="middle" class="label">Session Store</text>
    <text x="410" y="590" text-anchor="middle" class="label">PostgreSQL</text>
  </g>

  <!-- External Services -->
  <g id="external">
    <rect x="500" y="420" width="300" height="200" class="external" />
    <text x="650" y="440" text-anchor="middle" class="subtitle">External Services</text>
    
    <rect x="520" y="460" width="120" height="60" class="component" />
    <text x="580" y="485" text-anchor="middle" class="label">CDN Assets</text>
    <text x="580" y="500" text-anchor="middle" class="label">Google Fonts</text>
    <text x="580" y="515" text-anchor="middle" class="label">Thai Fonts</text>
    
    <rect x="660" y="460" width="120" height="60" class="component" />
    <text x="720" y="485" text-anchor="middle" class="label">Future APIs</text>
    <text x="720" y="500" text-anchor="middle" class="label">Email Service</text>
    <text x="720" y="515" text-anchor="middle" class="label">File Upload</text>
    
    <rect x="520" y="540" width="120" height="60" class="component" />
    <text x="580" y="565" text-anchor="middle" class="label">Monitoring</text>
    <text x="580" y="580" text-anchor="middle" class="label">Error Tracking</text>
    <text x="580" y="595" text-anchor="middle" class="label">Analytics</text>
    
    <rect x="660" y="540" width="120" height="60" class="component" />
    <text x="720" y="565" text-anchor="middle" class="label">Deployment</text>
    <text x="720" y="580" text-anchor="middle" class="label">Replit</text>
    <text x="720" y="595" text-anchor="middle" class="label">Auto Deploy</text>
  </g>

  <!-- Shared Schema -->
  <g id="shared">
    <rect x="850" y="420" width="300" height="200" class="component" />
    <text x="1000" y="440" text-anchor="middle" class="subtitle">Shared Schema</text>
    
    <rect x="870" y="460" width="120" height="60" class="component" />
    <text x="930" y="485" text-anchor="middle" class="label">Types</text>
    <text x="930" y="500" text-anchor="middle" class="label">Job, User</text>
    <text x="930" y="515" text-anchor="middle" class="label">Application</text>
    
    <rect x="1010" y="460" width="120" height="60" class="component" />
    <text x="1070" y="485" text-anchor="middle" class="label">Validation</text>
    <text x="1070" y="500" text-anchor="middle" class="label">Zod Schemas</text>
    <text x="1070" y="515" text-anchor="middle" class="label">Runtime Safety</text>
    
    <rect x="870" y="540" width="120" height="60" class="component" />
    <text x="930" y="565" text-anchor="middle" class="label">Database</text>
    <text x="930" y="580" text-anchor="middle" class="label">Drizzle Schema</text>
    <text x="930" y="595" text-anchor="middle" class="label">Type Generation</text>
    
    <rect x="1010" y="540" width="120" height="60" class="component" />
    <text x="1070" y="565" text-anchor="middle" class="label">Constants</text>
    <text x="1070" y="580" text-anchor="middle" class="label">Enums</text>
    <text x="1070" y="595" text-anchor="middle" class="label">Configurations</text>
  </g>

  <!-- Data Flow Arrows -->
  <!-- Frontend to Backend -->
  <path d="M 550 200 L 650 200" class="api-line" />
  <text x="600" y="195" text-anchor="middle" class="label">API Calls</text>
  
  <!-- Backend to Database -->
  <path d="M 900 360 L 900 420" class="data-line" />
  <text x="920" y="390" text-anchor="middle" class="label">SQL Queries</text>
  
  <!-- Shared Schema connections -->
  <path d="M 850 520 L 700 360" class="auth-line" />
  <text x="775" y="440" text-anchor="middle" class="label">Shared Types</text>
  
  <!-- External Services connections -->
  <path d="M 550 360 L 650 460" class="api-line" />
  <text x="600" y="410" text-anchor="middle" class="label">External APIs</text>

  <!-- Legend -->
  <g id="legend">
    <rect x="50" y="680" width="1100" height="100" class="component" />
    <text x="600" y="700" text-anchor="middle" class="subtitle">Architecture Legend</text>
    
    <rect x="70" y="710" width="30" height="20" class="frontend" />
    <text x="110" y="725" class="label">Frontend (React)</text>
    
    <rect x="220" y="710" width="30" height="20" class="backend" />
    <text x="260" y="725" class="label">Backend (Node.js)</text>
    
    <rect x="370" y="710" width="30" height="20" class="database" />
    <text x="410" y="725" class="label">Database (PostgreSQL)</text>
    
    <rect x="530" y="710" width="30" height="20" class="external" />
    <text x="570" y="725" class="label">External Services</text>
    
    <line x1="680" y1="720" x2="720" y2="720" class="api-line" />
    <text x="730" y="725" class="label">API Communication</text>
    
    <line x1="850" y1="720" x2="890" y2="720" class="data-line" />
    <text x="900" y="725" class="label">Database Operations</text>
    
    <line x1="1020" y1="720" x2="1060" y2="720" class="auth-line" />
    <text x="1070" y="725" class="label">Type Sharing</text>
    
    <text x="70" y="750" class="label">• Modern TypeScript stack with type safety across all layers</text>
    <text x="70" y="765" class="label">• Mobile-first responsive design optimized for Thai job seekers</text>
    <text x="600" y="750" class="label">• Serverless PostgreSQL with automatic scaling</text>
    <text x="600" y="765" class="label">• Integrated development environment with hot reload</text>
  </g>
</svg>